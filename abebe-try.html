<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>阿贝贝 · 试看版</title>
<link rel="stylesheet" href="./css/main.css">
<style>
html,body{height:100%;margin:0;touch-action:manipulation;overscroll-behavior:none}
body{overflow:hidden;background:linear-gradient(180deg,#FFF8FA 0%,#F7F1FB 50%,#FFF8FA 100%);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.at-page{position:relative;height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 18px);box-sizing:border-box;max-width:430px;margin:0 auto}
.at-head{text-align:center;flex-shrink:0}
.at-title{font-size:30px;letter-spacing:6px;color:#5a4a4f;font-weight:300}
.at-sub{font-size:13px;letter-spacing:2px;color:#b9a5ad;margin-top:4px}

.at-icon{position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:#8a767d;cursor:pointer;z-index:6;transition:transform .15s}
.at-icon:active{transform:scale(.9)}
.at-dream{position:absolute;right:6px;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);border-radius:20px;padding:4px 10px;font-size:11px;letter-spacing:1px;color:#8a767d;z-index:6;animation:atFloat 3s ease-in-out infinite}
@keyframes atFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.at-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:104px;margin-bottom:14px}
.at-bunny{position:relative;width:min(74vw,48vh,340px);aspect-ratio:1;touch-action:none;cursor:pointer}
.at-bunny img{width:100%;height:100%;object-fit:contain;pointer-events:none;transform-origin:50% 90%;-webkit-user-drag:none;animation:atIdle 3.8s ease-in-out infinite}
@keyframes atIdle{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.at-bunny img.night{animation:atIdle 6.5s ease-in-out infinite}
.at-bunny img.poke{animation:atPoke .38s ease}
@keyframes atPoke{0%{transform:scale(1,1)}35%{transform:scale(1.04,.93)}70%{transform:scale(.98,1.03)}100%{transform:scale(1,1)}}
.at-bunny img.grumpy{animation:atShake .45s ease}
@keyframes atShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.at-bunny img.comb{animation:atComb 1.1s ease-in-out infinite}
@keyframes atComb{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-2.2deg) scale(1.01)}75%{transform:rotate(2.2deg) scale(1.01)}}
.at-bunny img.shy{animation:atShy .7s ease}
@keyframes atShy{0%{transform:scale(1)}30%{transform:scale(1.07) translateY(-6px)}60%{transform:scale(.97)}100%{transform:scale(1)}}
.at-bunny img.daze{animation:atDaze 4.5s ease-in-out infinite}
@keyframes atDaze{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-1.6deg) translateY(3px)}}
.at-bunny img.wake{animation:atWake .5s ease}
@keyframes atWake{0%{transform:translateY(0)}40%{transform:translateY(-14px)}100%{transform:translateY(0)}}

.at-bubble{position:absolute;left:50%;top:-14px;transform:translate(-50%,-100%) translateY(8px);max-width:min(calc(100vw - 168px),230px);width:max-content;background:#F2AFC1;color:#fff;border-radius:18px;padding:9px 14px;font-size:12px;line-height:1.7;text-align:center;box-shadow:0 4px 16px rgba(212,120,158,.22);opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;z-index:5}
.at-bubble.on{opacity:1;transform:translate(-50%,-100%) translateY(0)}
.at-bubble::after{content:'';position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:#F2AFC1;border-radius:50%;transform:translateX(-50%)}
.at-bubble.think::after{bottom:-9px;width:9px;height:9px;left:46%}
.at-bubble.think::before{content:'';position:absolute;left:43%;bottom:-17px;width:5px;height:5px;background:#F2AFC1;border-radius:50%}
@keyframes atDot{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-5px);opacity:1}}


.at-shadow{position:absolute;left:50%;bottom:1%;width:46%;height:7%;margin-left:-23%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(186,120,150,.22) 0%,rgba(186,120,150,.08) 55%,transparent 72%);pointer-events:none;transform-origin:50% 50%}
.at-shadow.sway{animation:atShSway 3.8s ease-in-out infinite}
@keyframes atShSway{0%,100%{transform:translateX(-3%)}50%{transform:translateX(3%)}}
.at-shadow.hop{animation:atShHop .5s ease}
@keyframes atShHop{40%{transform:scale(.72);opacity:.6}}
.at-shadow.squish{animation:atShSq .38s ease}
@keyframes atShSq{35%{transform:scale(1.12,1)}}
.at-cloud{position:absolute;inset:0;pointer-events:none;z-index:7}
.at-cloud i{position:absolute;border-radius:50%;background:radial-gradient(circle at 42% 40%,rgba(255,255,255,1) 0%,rgba(255,246,249,.97) 40%,rgba(253,230,240,.82) 58%,rgba(253,226,238,0) 71%);filter:blur(1px);opacity:0;transition:transform .7s cubic-bezier(.3,1.3,.5,1),opacity .5s}
.at-cloud.on i{opacity:1;animation:atPuff 2.4s ease-in-out infinite}
@keyframes atPuff{0%,100%{scale:1}50%{scale:1.07}}
.at-cloud.out i{opacity:0;transition:transform .8s ease-out,opacity .7s}
.at-drape{position:absolute;left:9%;right:9%;top:-2%;height:84%;pointer-events:none;z-index:7}
.at-rod{position:absolute;left:-4%;right:-4%;top:0;height:5px;border-radius:3px;background:#E3B7C8;opacity:0;transition:opacity .3s}
.at-drape.on .at-rod{opacity:1}
.at-drape.out .at-rod{opacity:0;transition-delay:.35s}
.at-cloth{position:absolute;left:0;right:0;top:3px;bottom:0;transform-origin:50% 0;transform:scaleY(0);transition:transform .55s cubic-bezier(.3,1.2,.5,1);background:repeating-linear-gradient(90deg,#F7CFDC 0 14px,#F3C2D2 14px 22px,#F9D9E3 22px 34px);-webkit-mask:radial-gradient(circle at 12px 100%,transparent 9px,#000 9.5px) 0 0/24px 100% repeat-x;mask:radial-gradient(circle at 12px 100%,transparent 9px,#000 9.5px) 0 0/24px 100% repeat-x;box-shadow:inset 0 10px 18px rgba(255,255,255,.5)}
.at-drape.on .at-cloth{transform:scaleY(1)}
.at-drape.out .at-cloth{transform-origin:100% 0;transform:scaleX(.08);opacity:.6;transition:transform .55s ease-in,opacity .55s}
.at-bunny img.shuffle{animation:atShuffle .9s ease-in-out infinite}
@keyframes atShuffle{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.at-ctext{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:8;width:70%}
.at-ctext.on{opacity:1}
.at-mode{display:flex;justify-content:center;gap:8px;margin:0 0 12px}
.at-mode span{font-size:11px;padding:5px 12px;border-radius:12px;border:1px solid #F5C6D8;color:#a8899a}
.at-mode span.sel{background:#F2AFC1;color:#fff;border-color:#F2AFC1}
.at-cdots{display:flex;gap:9px}
.at-cdots i{width:8px;height:8px;border-radius:50%;background:#E8A0BF;animation:atCdot 1.1s ease-in-out infinite}
.at-cdots i:nth-child(2){animation-delay:.15s}.at-cdots i:nth-child(3){animation-delay:.3s}
@keyframes atCdot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-8px);opacity:1}}
.at-cline{font-size:12px;color:#a8899a;letter-spacing:.5px;text-align:center;max-width:78%;line-height:1.7}
.at-hint2{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;color:#c9a9b6;letter-spacing:1px;opacity:0;transition:opacity .8s;pointer-events:none}
.at-hint2.on{opacity:1}
.at-fx{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:4}
.at-heart{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px}
.at-heart svg{width:100%;height:100%;display:block}
.at-charge{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;transform:scale(.2);opacity:0;transition:transform .7s cubic-bezier(.3,.8,.4,1),opacity .2s}
.at-charge.grow{transform:scale(1);opacity:.85}
.at-charge.shrink{transition:transform .25s ease,opacity .25s;transform:scale(.1);opacity:0}
.at-fluff{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(242,175,193,.6)}
.at-spark{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px}
.at-ripple{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:1.5px solid rgba(242,175,193,.8);animation:atRipple .5s ease-out forwards}
@keyframes atRipple{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}

.at-tools{position:absolute;right:-12px;bottom:0;display:flex;flex-direction:column;gap:10px;z-index:6}
.at-tool{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:#8a767d;font-size:10px;letter-spacing:.3px;cursor:pointer;transition:transform .15s}
.at-tool:active{transform:scale(.9)}
.at-tool b{font-weight:300;font-size:10.5px}

.at-status{display:flex;flex-direction:column;gap:12px;padding:0 6px;flex-shrink:0}
.at-row{display:flex;align-items:center;gap:10px}
.at-row span{font-size:11px;color:#9a8890;width:46px;text-align:right;letter-spacing:.5px}
.at-track{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#FDE8F0,#F5C6D8,#E8A0BF,#D4789E,#BA5080);position:relative}
.at-knob{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid #E8A0BF;transform:translate(-50%,-50%);transition:left .6s ease}

.at-toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(90,74,79,.82);color:#fff;font-size:12px;padding:8px 14px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.at-toast.on{opacity:1}

.at-picker{position:fixed;inset:0;background:rgba(80,60,70,.35);display:none;align-items:flex-end;z-index:30}
.at-picker.on{display:flex}
.at-sheet{background:#FFF8FA;width:100%;max-width:430px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px);max-height:62vh;overflow-y:auto}
.at-sheet h3{font-weight:300;font-size:14px;color:#7a6a70;text-align:center;margin:0 0 4px;letter-spacing:1px}
.at-sheet p{font-size:11px;color:#b9a5ad;text-align:center;margin:0 0 12px}
.at-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.at-grid div{aspect-ratio:1;border-radius:12px;background:#fff;border:1px solid #F5C6D8;display:flex;align-items:center;justify-content:center;overflow:hidden}
.at-grid img{width:90%;height:90%;object-fit:contain}
</style>
</head>
<body>
<div class="at-page" id="page">
  <div class="at-head">
    <div class="topbar-title">Abebe</div>
    <div class="topbar-sub">柔软的兔子王国</div>
  </div>

  <div class="at-icon" style="top:calc(env(safe-area-inset-top) + 84px);left:6px" onclick="toast('试看版里先不聊天哦')" aria-label="聊天"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5V17.5H4A1.5 1.5 0 0 1 2.5 16V7A1.5 1.5 0 0 1 4 5.5z"/><circle cx="8" cy="11.5" r=".6" fill="currentColor"/><circle cx="12" cy="11.5" r=".6" fill="currentColor"/><circle cx="16" cy="11.5" r=".6" fill="currentColor"/></svg></div>
  <div class="at-icon" style="top:calc(env(safe-area-inset-top) + 128px);left:6px" onclick="openPicker()" aria-label="换衣服试试"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.2a1.8 1.8 0 1 1 1.8-1.8"/><path d="M12 7.2v1.3L3.2 15.4A1.1 1.1 0 0 0 3.9 17.4h16.2a1.1 1.1 0 0 0 .7-2L12 8.5"/></svg></div>
  <div class="at-dream" style="top:calc(env(safe-area-inset-top) + 86px)">ᶻ 𝗓 𝐙 𝗓 ᶻ</div>

  <div class="at-stage">
    <div class="at-bunny" id="bunny">
      <div class="at-shadow" id="shadow"></div>
      <img id="bimg" src="./outfits/c03.webp" alt="阿贝贝">
      <div class="at-cloud" id="cloud"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="at-drape" id="drape"><b class="at-rod"></b><div class="at-cloth"></div></div>
      <div class="at-ctext" id="ctext"><div class="at-cdots"><i></i><i></i><i></i></div><div class="at-cline" id="cline"></div></div>
      <div class="at-hint2" id="hint2">点一下戳戳 · 划一划梳毛 · 按住亲亲</div>
      <div class="at-fx" id="fx"></div>
      <div class="at-bubble" id="bubble"></div>
    </div>
    <div class="at-tools">
      <div class="at-tool" onclick="toast('小卖部')" aria-label="小卖部"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 5.5 5h13L20 9.5"/><path d="M4 9.5c0 1.4 1.1 2.3 2.3 2.3S8.7 10.9 8.7 9.5c0 1.4 1.1 2.3 2.3 2.3s2.3-.9 2.3-2.3c0 1.4 1.1 2.3 2.3 2.3S18 10.9 18 9.5c0 1.4.9 2.3 2 2.3"/><path d="M5.5 12v7h13v-7"/><path d="M10 19v-4h4v4"/></svg></div>
      <div class="at-tool" onclick="toast('小糖果')" aria-label="小糖果"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M8.3 10.4 4 8v8l4.3-2.4M15.7 10.4 20 8v8l-4.3-2.4"/></svg></div>
      <div class="at-tool" onclick="toast('翻糖糖')" aria-label="翻糖糖"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6" width="9" height="12.5" rx="1.6" transform="rotate(-8 8 12)"/><rect x="11.5" y="5.5" width="9" height="12.5" rx="1.6" transform="rotate(8 16 12)"/></svg></div>
      <div class="at-tool" onclick="toast('2048')" aria-label="2048"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg></div>
    </div>
  </div>


  <div class="at-status" id="status"></div>
</div>
<div class="at-toast" id="toast"></div>
<div class="at-picker" id="picker" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="at-sheet"><h3>换件衣服试试手势</h3><p>只是试看，不会真的换掉阿贝贝的衣服</p><div class="at-mode" id="mode"><span data-m="cloud" class="sel" onclick="setMode(this)">云团</span><span data-m="drape" onclick="setMode(this)">小帘子</span></div><div class="at-grid" id="grid"></div></div>
</div>

<script src="./data/abebe-words.js"></script>
<script src="./data/outfits.js"></script>
<script>
const $=id=>document.getElementById(id);
const rand=a=>a[Math.floor(Math.random()*a.length)];
const idleDay=["嗯……窗外的云好像棉花糖","你在想什么呀","我刚才数了一下罐子里的糖，忘记数到几了","风吹进来了，好舒服","我好像闻到了花的味道","如果我有翅膀就好了，但想想还是算了","我在想以后的事，但想不太远","你知道吗，安静也是一种声音"];
const idleNight=["呜啊……（大哈欠）","月亮出来了……它也在打瞌睡","星星在眨眼睛，我也在眨","被子外面好冷，里面好暖","我梦到了一片粉色的海"];
const pokeMore=["再戳……再戳我就要咬手指了哦","阿贝贝把脸埋进爪子里：不给戳了","阿贝贝鼓起腮帮子，瞪了你一眼","戳戳戳，你是啄木鸟吗","阿贝贝转过身去，只给你看后脑勺"];
const pokeMax=["哼！阿贝贝生气了，要一根胡萝卜才能哄好","阿贝贝跺了跺脚：我要告诉爸爸！","阿贝贝缩成一个球，谁也不理","不理你了不理你了不理你了"];
const wakeLines=["啊？我刚刚……没在发呆哦","阿贝贝一激灵，耳朵竖了起来","嗯？你叫我啦？","阿贝贝眨眨眼，好像刚从很远的地方回来"];
const groomDone=["阿贝贝的毛被梳得蓬蓬的，像一朵云","阿贝贝舒服得眯起眼，差点睡着了","阿贝贝转了一圈给你看：香香的！"];
const L=k=>(typeof abebeLines!=='undefined'&&abebeLines[k]&&abebeLines[k].length)?abebeLines[k]:["……"];

// 状态栏（试看版里只是摆着）
const st={'兔兔心':78,'睡觉觉':66,'吃饱饱':64,'想泥萌':92,'洗香香':62};
function renderStatus(){$('status').innerHTML=Object.entries(st).map(([k,v])=>`<div class="at-row"><span>${k}</span><div class="at-track"><div class="at-knob" style="left:${Math.max(0,Math.min(100,v))}%"></div></div></div>`).join('');}
renderStatus();
const bump=(k,n)=>{st[k]=Math.min(100,st[k]+n);renderStatus();};

// 气泡：飘在头顶，说完淡掉，新的直接换掉旧的
let bubT=null;
function say(t,think){
  if(wearing) return;
  const b=$('bubble');clearTimeout(bubT);
  b.classList.remove('on');
  setTimeout(()=>{b.textContent=t;b.classList.toggle('think',!!think);b.classList.add('on');},b.textContent?120:0);
  bubT=setTimeout(()=>b.classList.remove('on'),2600+t.length*90);
}
function toast(t){const e=$('toast');e.textContent=t+(t.length<6?' · 试看版里先不进去':'');e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1500);}

const img=$('bimg'),fx=$('fx'),bunny=$('bunny');
const shadow=$('shadow');
function anim(cls){img.classList.remove('poke','grumpy','shy','wake');void img.offsetWidth;img.classList.add(cls);setTimeout(()=>img.classList.remove(cls),750);
  const sc={poke:'squish',grumpy:'squish',shy:'hop',wake:'hop'}[cls];if(sc){shadow.classList.remove('hop','squish');void shadow.offsetWidth;shadow.classList.add(sc);setTimeout(()=>shadow.classList.remove(sc),600);}}

// 小爱心：淡淡的、半透明、颜色跟主题粉
const HEART='<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.7C19.5 15.9 12 20.5 12 20.5z" fill="#F2AFC1" stroke="#fff" stroke-width="1.2"/></svg>';
const HEART2='<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.7C19.5 15.9 12 20.5 12 20.5z" fill="#FBD5E0"/></svg>';
function burstHearts(x,y){
  const n=13;
  for(let i=0;i<n;i++){
    const h=document.createElement('div');h.className='at-heart';
    h.innerHTML=Math.random()<.5?HEART:HEART2;
    const s=.45+Math.random()*.8;h.style.left=x+'px';h.style.top=y+'px';
    fx.appendChild(h);
    const ang=-Math.PI/2+(Math.random()-.5)*2.4, dist=50+Math.random()*90;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-30-Math.random()*40;
    const op=.35+Math.random()*.4, rot=(Math.random()-.5)*50;
    h.animate([
      {transform:`translate(0,0) scale(${s*.3}) rotate(0)`,opacity:0},
      {transform:`translate(${dx*.4}px,${dy*.4}px) scale(${s}) rotate(${rot*.4}deg)`,opacity:op,offset:.25},
      {transform:`translate(${dx+(Math.random()-.5)*20}px,${dy}px) scale(${s*.9}) rotate(${rot}deg)`,opacity:0}
    ],{duration:1400+Math.random()*900,easing:'cubic-bezier(.2,.7,.3,1)',delay:i*35}).onfinish=()=>h.remove();
  }
}
function ripple(x,y){const r=document.createElement('div');r.className='at-ripple';r.style.left=x+'px';r.style.top=y+'px';fx.appendChild(r);setTimeout(()=>r.remove(),520);}
function fluff(x,y){
  const f=document.createElement('div');f.className='at-fluff';
  const s=3+Math.random()*4;f.style.width=s*1.6+'px';f.style.height=s+'px';
  f.style.left=x+'px';f.style.top=y+'px';fx.appendChild(f);
  const dx=(Math.random()-.5)*40,dy=-20-Math.random()*40;
  f.animate([{transform:'translate(0,0) rotate(0)',opacity:.95},{transform:`translate(${dx}px,${dy}px) rotate(${(Math.random()-.5)*180}deg)`,opacity:0}],{duration:900+Math.random()*500,easing:'ease-out'}).onfinish=()=>f.remove();
  if(Math.random()<.35){
    const sp=document.createElement('div');sp.className='at-spark';
    sp.innerHTML='<svg viewBox="0 0 10 10"><path d="M5 0 6 4 10 5 6 6 5 10 4 6 0 5 4 4z" fill="#F7C4D4"/></svg>';
    sp.style.left=(x+(Math.random()-.5)*16)+'px';sp.style.top=(y+(Math.random()-.5)*16)+'px';fx.appendChild(sp);
    sp.animate([{transform:'scale(0)',opacity:0},{transform:'scale(1.2)',opacity:1,offset:.4},{transform:'scale(0)',opacity:0}],{duration:700}).onfinish=()=>sp.remove();
  }
}

// 发呆：一阵子不碰她，她自己放空
let idleT=null,dazing=false,dazeTalkT=null;
function resetIdle(){
  clearTimeout(idleT);clearTimeout(dazeTalkT);
  idleT=setTimeout(startDaze,18000);
}
function startDaze(){
  dazing=true;img.classList.add('daze');
  say(rand(L('dazed')),true);
  const talk=()=>{dazeTalkT=setTimeout(()=>{if(!dazing)return;const h=new Date().getHours();say(rand((h>=22||h<6)?idleNight:idleDay),true);talk();},16000+Math.random()*10000);};
  talk();
}
function wakeUp(){
  if(!dazing) return false;
  dazing=false;img.classList.remove('daze');
  anim('wake');say(rand(wakeLines));return true;
}

// 戳戳连击
let pokeTimes=[];
function doPoke(x,y){
  ripple(x,y);
  const now=Date.now();pokeTimes=pokeTimes.filter(t=>now-t<8000);pokeTimes.push(now);
  const n=pokeTimes.length;
  if(n>=10){anim('grumpy');say(rand(pokeMax));bump('兔兔心',-2);}
  else if(n>=6){anim('grumpy');say(rand(pokeMore));}
  else{anim('poke');say(rand(L('poked')));bump('兔兔心',2);}
}

// 手势
let g=null;
const LP_DELAY=180, LP_FULL=720, MOVE_TOL=12;
function pos(e){const r=bunny.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
bunny.addEventListener('pointerdown',e=>{
  e.preventDefault();if(wearing) return;bunny.setPointerCapture(e.pointerId);
  $('hint2').classList.remove('on');
  const woke=wakeUp();
  const p=pos(e);
  g={id:e.pointerId,sx:p.x,sy:p.y,lx:p.x,ly:p.y,t:Date.now(),path:0,mode:null,woke,fluffAcc:0,groomSaid:false,charge:null};
  g.lpT=setTimeout(()=>{
    if(!g||g.mode) return;
    g.mode='kiss';
    const c=document.createElement('div');c.className='at-charge';c.innerHTML=HEART;
    c.style.left=g.lx+'px';c.style.top=(g.ly-26)+'px';fx.appendChild(c);
    requestAnimationFrame(()=>c.classList.add('grow'));
    g.charge=c;
    g.fullT=setTimeout(()=>{
      if(!g||g.mode!=='kiss') return;
      c.remove();g.charge=null;g.mode='kissed';
      burstHearts(g.lx,g.ly-26);anim('shy');say(rand(L('kissed')));
      bump('兔兔心',4);bump('想泥萌',4);
      if(navigator.vibrate) navigator.vibrate(12);
    },LP_FULL);
  },LP_DELAY);
  resetIdle();
});
bunny.addEventListener('pointermove',e=>{
  if(!g||e.pointerId!==g.id) return;
  const p=pos(e);const d=Math.hypot(p.x-g.lx,p.y-g.ly);
  g.path+=d;g.lx=p.x;g.ly=p.y;
  const far=Math.hypot(p.x-g.sx,p.y-g.sy)>MOVE_TOL;
  if(g.mode==='kiss'&&far){cancelCharge();g.mode='groom';}
  if(!g.mode&&far){clearTimeout(g.lpT);g.mode='groom';}
  if(g.mode==='groom'){
    img.classList.add('comb');
    g.fluffAcc+=d;
    while(g.fluffAcc>14){g.fluffAcc-=14;fluff(p.x,p.y);}
    if(!g.groomSaid&&g.path>320){g.groomSaid=true;say(rand(L('groomed')));bump('洗香香',12);}
    if(g.groomSaid&&g.path>1100&&!g.groomDone){g.groomDone=true;say(rand(groomDone));bump('洗香香',10);bump('兔兔心',3);}
  }
});
function cancelCharge(){
  clearTimeout(g.fullT);
  if(g.charge){const c=g.charge;c.classList.remove('grow');c.classList.add('shrink');setTimeout(()=>c.remove(),260);g.charge=null;}
}
function endGesture(e){
  if(!g||e.pointerId!==g.id) return;
  clearTimeout(g.lpT);
  if(g.mode==='kiss') cancelCharge();
  if(!g.mode&&!g.woke&&Date.now()-g.t<350){doPoke(g.lx,g.ly);}
  if(g.mode==='groom'&&!g.groomSaid&&g.path>90){say(rand(L('groomed')));bump('洗香香',6);}
  img.classList.remove('comb');
  g=null;resetIdle();
}
bunny.addEventListener('pointerup',endGesture);
bunny.addEventListener('pointercancel',endGesture);
bunny.addEventListener('contextmenu',e=>e.preventDefault());

// 换衣服试试（只在试看版里）
function openPicker(){
  const list=[{src:'./愉快阿贝贝.png'}].concat(['c01','c02','c03'].map(id=>({src:'./outfits/'+id+'.webp',th:'./outfits/'+id+'_s.webp'})))
    .concat((typeof OUTFITS!=='undefined'?OUTFITS:[]).map(o=>({src:'./outfits/'+o.id+'.webp'+(o.v?'?v='+o.v:''),th:'./outfits/'+o.id+'_s.webp'+(o.v?'?v='+o.v:'')})));
  preloadAll(list);
  $('grid').innerHTML=list.map(o=>`<div onclick="wear('${o.src}')"><img src="${o.th||o.src}" loading="lazy"></div>`).join('');
  $('picker').classList.add('on');
}
const cloudLines=["阿贝贝钻进云朵里换衣服啦，不许偷看","云朵里面窸窸窣窣的……","阿贝贝说：等一下等一下，扣子扣歪了","云朵鼓了一下，好像有只爪子在里面乱挥","嘘——阿贝贝在挑配哪双袜子","云朵缝里露出一只耳朵，又缩回去了","阿贝贝小声说：你先闭上眼睛"];
const changeLines=["阿贝贝躲到帘子后面换衣服啦，不许偷看","帘子后面窸窸窣窣的……","阿贝贝说：等一下等一下，扣子扣歪了","阿贝贝在镜子前面转了一圈又一圈","嘘——阿贝贝在挑配哪双袜子","帘子动了一下，露出一只耳朵，又缩回去了","阿贝贝小声说：你先闭上眼睛"];
const changedLines=["当当！好看吗","阿贝贝原地转了个圈，差点把自己转晕","阿贝贝低头看看自己，又抬头看看你","新衣服！阿贝贝站得直直的给你看"];
let wearing=false,changeMode='cloud';
function setMode(el){changeMode=el.dataset.m;document.querySelectorAll('#mode span').forEach(x=>x.classList.toggle('sel',x===el));}
const PUFFS=[[2,12,42],[34,0,46],[58,16,40],[0,44,44],[28,30,56],[60,48,40],[12,66,40],[46,64,42]];
function showChange(){
  $('cline').textContent=rand(changeMode==='cloud'?cloudLines:changeLines);
  if(changeMode==='cloud'){
    const c=$('cloud');c.classList.remove('out');
    c.querySelectorAll('i').forEach((p,k)=>{const [x,y,w]=PUFFS[k];p.style.left=x+'%';p.style.top=y+'%';p.style.width=w+'%';p.style.height=w+'%';
      const dx=(x+w/2-50)*3,dy=(y+w/2-50)*3;p.style.transition='none';p.style.transform=`translate(${dx}%,${dy}%) scale(.4)`;p.style.animationDelay=(-k*.37)+'s';});
    void c.offsetWidth;c.querySelectorAll('i').forEach((p,k)=>{p.style.transition='';setTimeout(()=>p.style.transform='translate(0,0) scale(1)',k*45);});
    c.classList.add('on');
  }else{
    const d=$('drape');d.classList.remove('out');d.classList.add('on');
    setTimeout(()=>img.classList.add('shuffle'),400);
  }
  setTimeout(()=>$('ctext').classList.add('on'),250);
}
function hideChange(){
  $('ctext').classList.remove('on');
  if(changeMode==='cloud'){
    const c=$('cloud');
    c.querySelectorAll('i').forEach(p=>{const x=parseFloat(p.style.left),y=parseFloat(p.style.top),w=parseFloat(p.style.width);p.style.transform=`translate(${(x+w/2-50)*3}%,${(y+w/2-50)*3}%) scale(1.3)`;});
    c.classList.add('out');setTimeout(()=>c.classList.remove('on','out'),850);
  }else{
    img.classList.remove('shuffle');
    const d=$('drape');d.classList.add('out');setTimeout(()=>d.classList.remove('on','out'),600);
  }
}
function wear(src){
  $('picker').classList.remove('on');
  if(wearing||img.getAttribute('src')===src) return;
  wearing=true;clearTimeout(bubT);$('bubble').classList.remove('on');
  if(dazing){dazing=false;img.classList.remove('daze');}
  clearTimeout(idleT);clearTimeout(dazeTalkT);
  showChange();
  const t0=Date.now();let done=false;
  const finish=()=>{if(done)return;done=true;
    setTimeout(()=>{img.src=src;
      setTimeout(()=>{hideChange();
        setTimeout(()=>{anim('wake');const r=bunny.getBoundingClientRect();for(let i=0;i<10;i++)setTimeout(()=>fluff(r.width*(.3+Math.random()*.4),r.height*(.25+Math.random()*.45)),i*40);
          wearing=false;say(rand(changedLines));resetIdle();},changeMode==='cloud'?350:300);
      },150);
    },Math.max(0,1600-(Date.now()-t0)));};
  const pre=new Image();pre.onload=finish;pre.onerror=finish;pre.src=src;setTimeout(finish,8000);
}
// 打开衣柜时先把衣服图偷偷下载好
const preloaded={};
function preloadAll(list){list.forEach(o=>{if(preloaded[o.src])return;const im=new Image();im.src=o.src;preloaded[o.src]=im;});}

['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
let lastTouchEnd=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouchEnd<350)e.preventDefault();lastTouchEnd=n;},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
{const h=new Date().getHours();if(h>=22||h<6)img.classList.add('night');}
shadow.classList.add('sway');
try{const n=+(localStorage.getItem('abebeGestureHint')||0);if(n<3){localStorage.setItem('abebeGestureHint',n+1);setTimeout(()=>$('hint2').classList.add('on'),900);setTimeout(()=>$('hint2').classList.remove('on'),9000);}}catch(e){}
setTimeout(()=>say(rand(L('visit'))),500);
resetIdle();
