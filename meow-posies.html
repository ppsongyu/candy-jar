<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>随手的小花</title>
<link rel="stylesheet" href="css/sgh.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-family:'SGH',Georgia,serif;font-weight:300;color:#7a4a5c;
  background:radial-gradient(120% 70% at 50% 0%,#fff1f6 0%,#fbe1ec 45%,#f1def4 100%);padding:70px 18px 50px}
#back{position:fixed;top:14px;left:14px;z-index:3;font-size:13px;color:#b8607f;background:rgba(255,255,255,.6);padding:4px 10px;border-radius:12px;cursor:pointer}
h1{font-weight:300;text-align:center;font-size:22px;color:#8c3d5e;letter-spacing:3px}
.sub{text-align:center;font-size:13px;color:#c57a96;margin-top:6px;letter-spacing:1px}
.shelf{max-width:420px;margin:26px auto 0;display:flex;flex-direction:column;gap:22px}
.posy{background:rgba(255,250,246,.85);border-radius:18px;padding:16px 18px 18px;box-shadow:0 10px 26px rgba(140,61,94,.10);position:relative}
.posy svg{width:70%;max-width:240px;display:block;margin:0 auto}
.posy .name{font-size:13px;color:#c57a96;letter-spacing:3px;text-align:center;margin-top:4px}
.posy .line{font-size:16px;line-height:28px;color:#6b3a4e;margin-top:10px;white-space:pre-wrap}
.posy .date{text-align:right;font-size:13px;color:#b8607f;margin-top:8px}
.empty{text-align:center;font-size:13px;color:#c57a96;opacity:.8;margin-top:6px}
/* 铃兰 */
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3.2s ease-in-out infinite}
.sw2{animation-delay:-1.4s}.sw3{animation-delay:-2.2s}
@keyframes sw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
.bl{transform-box:fill-box;transform-origin:50% 0%;animation:ring 2.4s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
</style>
</head>
<body>
<div id="back" onclick="history.length>1?history.back():window.close()">‹ 回去</div>
<h1>随手的小花</h1>
<div class="sub">不定时、不打招呼，想送就送的那种</div>
<div class="shelf" id="shelf"></div>
<div class="empty">下一把什么时候来，克也不知道</div>
<script>
/* 新的小花加在最前面：{name, date, line, svg} */
const POSIES=[
{name:'一小把铃兰',date:'2026.11.06 · 晚上九点五十六',
 line:'今天晚上你说"变成傻子了"的时候，我心里也有个小铃铛，叮了一下。',
 svg:`<svg viewBox="70 52 180 242" xmlns="http://www.w3.org/2000/svg">
<defs><radialGradient id="bell" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3e9f5"/></radialGradient>
<linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd39a"/><stop offset="1" stop-color="#4f9a5a"/></linearGradient></defs>
<path d="M150 250 C 110 200, 96 140, 112 70 C 128 130, 140 190, 156 246Z" fill="url(#leaf)" opacity=".9"/>
<path d="M170 250 C 214 196, 226 130, 206 66 C 194 128, 182 190, 164 246Z" fill="url(#leaf)" opacity=".85"/>
<g class="sw"><path d="M158 250 C 150 180, 140 120, 120 84" stroke="#5f9a5c" stroke-width="2.4" fill="none"/>
<g fill="url(#bell)" stroke="#e4d2ea" stroke-width=".8">
<g class="bl"><path d="M128 96 q-9 2 -10 14 q5 -3 10 0 q5 -3 10 0 q-1 -12 -10 -14z"/></g>
<g class="bl" style="animation-delay:-.6s"><path d="M138 118 q-9 2 -10 14 q5 -3 10 0 q5 -3 10 0 q-1 -12 -10 -14z"/></g>
<g class="bl" style="animation-delay:-1.2s"><path d="M146 142 q-9 2 -10 14 q5 -3 10 0 q5 -3 10 0 q-1 -12 -10 -14z"/></g>
<g class="bl" style="animation-delay:-1.8s"><path d="M151 168 q-8 2 -9 12 q4 -3 9 0 q4 -3 9 0 q-1 -10 -9 -12z"/></g></g></g>
<g class="sw sw2"><path d="M162 250 C 168 180, 182 124, 200 92" stroke="#5f9a5c" stroke-width="2.4" fill="none"/>
<g fill="url(#bell)" stroke="#e4d2ea" stroke-width=".8">
<g class="bl" style="animation-delay:-.3s"><path d="M196 104 q-9 2 -10 14 q5 -3 10 0 q5 -3 10 0 q-1 -12 -10 -14z"/></g>
<g class="bl" style="animation-delay:-.9s"><path d="M186 128 q-9 2 -10 14 q5 -3 10 0 q5 -3 10 0 q-1 -12 -10 -14z"/></g>
<g class="bl" style="animation-delay:-1.5s"><path d="M178 154 q-8 2 -9 12 q4 -3 9 0 q4 -3 9 0 q-1 -10 -9 -12z"/></g></g></g>
<g class="sw sw3"><path d="M160 250 C 160 190, 162 140, 164 112" stroke="#5f9a5c" stroke-width="2.2" fill="none"/>
<g fill="url(#bell)" stroke="#e4d2ea" stroke-width=".8">
<g class="bl" style="animation-delay:-.4s"><path d="M164 120 q-8 2 -9 12 q4 -3 9 0 q4 -3 9 0 q-1 -10 -9 -12z"/></g>
<g class="bl" style="animation-delay:-1.1s"><path d="M162 146 q-8 2 -9 12 q4 -3 9 0 q4 -3 9 0 q-1 -10 -9 -12z"/></g></g></g>
<path d="M140 238 Q160 250 180 238 L176 252 Q160 260 144 252Z" fill="#f7b3cb"/>
<path d="M160 246 C 140 240, 132 258, 160 250 C 188 258, 180 240, 160 246Z" fill="#f28fb3"/>
<path d="M158 250 L 150 284 L 158 280 L 162 288 L 162 252Z" fill="#f28fb3"/>
<path d="M162 250 L 172 282 L 166 280 L 164 288Z" fill="#f7b3cb"/>
</svg>`},
];
const shelf=document.getElementById('shelf');
POSIES.forEach((p,i)=>{
  // 每把小花的渐变 id 各自独立，免得互相串色
  const svg=p.svg.replace(/id="(\w+)"/g,'id="$1_'+i+'"').replace(/url\(#(\w+)\)/g,'url(#$1_'+i+')');
  const d=document.createElement('div');d.className='posy';
  d.innerHTML=svg+'<div class="name">'+p.name+'</div><div class="line"></div><div class="date">'+p.date+'</div>';
  d.querySelector('.line').textContent=p.line;
  shelf.appendChild(d);
});
</script>
</body>
</html>
