*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);min-height:100%}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.7;letter-spacing:.03em;padding-inline:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
button:focus-visible,summary:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.app{max-width:960px;margin:0 auto;padding-block:14px calc(76px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.brand{font-size:21px;letter-spacing:.16em;line-height:1.2}
.since{font-size:10.5px;color:var(--ink3);letter-spacing:.28em;margin-top:4px}
.no{font-size:12px;color:var(--ink2);letter-spacing:.14em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.lf{stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
.gl{fill:var(--glass)}
.stw{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
/* make */
.make{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-block:14px 14px;border-bottom:1px solid var(--line);text-align:center}
.stage .cupbox{height:190px;display:flex;justify-content:center;align-items:flex-end}
.mname{font-size:19px;margin-top:6px;line-height:1.35;text-wrap:balance;min-height:26px}
.mmeta{font-size:11.5px;color:var(--ink3);letter-spacing:.2em;margin-top:2px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 20px;font-size:14px;letter-spacing:.12em}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.panel{display:flex;flex-direction:column}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 2px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .sl{font-size:15px;letter-spacing:.14em;flex:none}
summary .sv{font-size:12.5px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;flex:1}
summary::after{content:"+";color:var(--ink3);font-size:16px;width:12px;text-align:center;flex:none}
details[open] summary::after{content:"−"}
.body{padding:0 0 18px}
.gh{font-size:11px;color:var(--ink3);letter-spacing:.24em;margin:4px 0 8px}
.gh~.gh{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.q{border:1px solid var(--line);background:var(--paper);border-radius:999px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 14px}
.chip[aria-pressed="true"],.q.on{border-color:var(--ink);box-shadow:inset 0 0 0 .5px var(--ink)}
.q{display:inline-flex;align-items:stretch}
.q button{border:0;background:none;display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 14px}
.q .mi{padding:6px 12px;border-left:1px solid var(--line);color:var(--ink2)}
.dots{display:inline-flex;gap:3px;margin-left:2px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
@media (min-width:780px){
  .make{grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:40px;align-items:start}
  .stage{top:calc(env(safe-area-inset-top,0px) + 12px);border:0;padding-top:28px}
  .stage .cupbox{height:260px}
}
/* drink */
.drink{max-width:420px;margin:0 auto;text-align:center;padding-top:18px}
.ticket{display:flex;justify-content:space-between;font-size:11.5px;font-variant-numeric:tabular-nums}
.drink .cupbox{height:320px;display:flex;justify-content:center;align-items:flex-end;margin-top:20px}
.dname{font-size:25px;letter-spacing:.1em;margin-top:14px;line-height:1.35;text-wrap:balance}
.dmeta{font-size:12px;color:var(--ink3);letter-spacing:.2em;margin-top:4px;min-height:20px}
.note{margin:20px 0 4px;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:14px 18px;text-align:left}
.note .k{font-size:11px;letter-spacing:.26em;color:var(--ink3)}
.note .d{font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.8}
.note .c,.note .w{font-size:12px;color:var(--ink3);margin-top:8px;letter-spacing:.08em}
.note .w{color:var(--ink2)}
.drink .acts{margin-top:20px}
/* book */
.bookh{display:flex;justify-content:space-between;align-items:baseline;padding-top:22px}
.bookh h2{font-size:22px;font-weight:400;letter-spacing:.2em;margin:0}
.bc{font-size:13px;color:var(--ink2);letter-spacing:.12em;font-variant-numeric:tabular-nums}
.bar{height:1px;background:var(--line);margin:12px 0 20px}
.bar i{display:block;height:1px;background:var(--ink);transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.card{background:var(--paper);border:0;padding:18px 12px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
button.card:hover{background:var(--tint)}
.card .cc{height:100px;display:flex;align-items:flex-end}
.cn{font-size:15px;letter-spacing:.08em;margin-top:6px}
.cn.dim{color:var(--ink3)}
.cd{font-size:12px;color:var(--ink2);line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-size:10.5px;letter-spacing:.22em;color:var(--ink2);border:1px solid var(--line);padding:0 8px;margin-top:4px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;letter-spacing:.26em;color:var(--ink3)}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] .ln{stroke:var(--ink)}
.tabs .ln{stroke:var(--ink3);stroke-width:1.3}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.seg{display:flex;justify-content:center;gap:26px;margin-bottom:6px}
.seg button{border:0;background:none;padding:4px 1px;font-size:14px;letter-spacing:.22em;color:var(--ink3);border-bottom:1px solid transparent;display:inline-flex;align-items:baseline;gap:6px}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.seg small{font-size:11px;letter-spacing:.06em;color:var(--ink3);font-variant-numeric:tabular-nums}
#seg-book{justify-content:flex-start;margin:0 0 18px}
.closed{padding:36px 8px 20px;text-align:center;color:var(--ink2);line-height:2;font-size:14px}
.closed .sign{display:inline-block;border:1px solid var(--ink);color:var(--ink);padding:6px 20px;letter-spacing:.34em;margin-bottom:16px;font-size:15px}
.btn:disabled{opacity:.35;cursor:default}
.btn{padding:8px 17px}
.ticket{cursor:pointer;border:0;background:none;width:100%;font:inherit;letter-spacing:.2em;color:var(--ink3);padding:0 0 10px;border-bottom:1px dashed var(--line)}
.ticket b{font-weight:400;color:var(--ink2)}
.rcpt{margin-top:14px;background:var(--paper);border:1px solid var(--line);padding:18px 20px 16px;text-align:left}
.rrow{display:flex;justify-content:space-between;gap:16px;font-size:13.5px;padding:3px 0}
.rrow span:first-child{color:var(--ink3);letter-spacing:.14em;flex:none}
.rrow span:last-child{text-align:right;min-width:0}
.rsum{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.rbc{display:flex;justify-content:center;margin:14px 0 4px}
.rbc svg{height:44px;width:auto;max-width:100%}
.rft{text-align:center;font-size:11px;color:var(--ink3);letter-spacing:.24em}
.racts{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.racts .btn{display:inline-flex;align-items:center;gap:6px}
.heart{width:15px;height:15px}
.btn.on .heart path{fill:var(--ink)}
.fbox{margin-top:12px;display:flex;gap:8px}
.fbox input{flex:1;min-width:0;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px}
.rimg{margin-top:14px;text-align:center}
.rimg img{width:100%;max-width:320px;border:1px solid var(--line);display:block;margin:0 auto}
.rimg p{font-size:12px;color:var(--ink2);margin:8px 0 0}
.empty{padding:40px 12px;text-align:center;color:var(--ink2);font-size:13.5px;line-height:1.9;border:1px solid var(--line);background:var(--paper)}
</style>

<script>
const TEA_GROUPS=[
 ['红茶',{'阿萨姆':'#8f4a26','锡兰':'#a65a2a','滇红':'#9a4d22','英德红茶':'#86401f','伯爵红茶':'#7d4a34','泰式红茶':'#e0782f','玫瑰红茶':'#a1454b'}],
 ['绿茶 · 白茶',{'茉莉绿茶':'#cfd37e','绿茶':'#b8cf7a','抹茶':'#6f9f4f','老白茶':'#d6b676'}],
 ['乌龙',{'四季春':'#d8c76c','金萱':'#d6b660','铁观音':'#c49843','冻顶乌龙':'#ad7736','大红袍':'#8c4e2a','白桃乌龙':'#e3b27c','桂花乌龙':'#c98a3a','鸭屎香':'#cf9b4b','蜜兰香':'#c68b3d'}],
 ['其他',{'普洱':'#4a2618','洛神花':'#a3243f','不要茶':null}]];
const TEAS={};TEA_GROUPS.forEach(([g,o])=>Object.entries(o).forEach(([k,c])=>TEAS[k]={c,g}));
const FR={'草莓':{t:'#f07c96',k:'half',c:'#e8475f'},'芒果':{t:'#f6b73c',k:'cube',c:'#f5ae2c'},'蜜桃':{t:'#f7a996',k:'cube',c:'#f5a489'},'葡萄':{t:'#8e5aa8',k:'ball',c:'#6c3a8e',r:7},'青提':{t:'#c6dc86',k:'ball',c:'#b3d36a',r:6.5},'荔枝':{t:'#f3ece0',k:'ball',c:'#f8f4ec',r:7,s:'#d9cdbb'},'柠檬':{t:'#f1e07a',k:'slice',c:'#f4dc4a',s:'#dcbd2a'},'橙子':{t:'#f5aa4c',k:'slice',c:'#f7a53c',s:'#dc841c'},'西柚':{t:'#f28b7c',k:'slice',c:'#f07262',s:'#d25243'},'菠萝':{t:'#f4d661',k:'cube',c:'#f4d04a'},'百香果':{t:'#eec350',k:'seed',c:'#f0c34a'},'椰子':{t:'#f2eee4',k:'cube',c:'#fbf8f0',s:'#dcd2c0'},'蓝莓':{t:'#5d60a8',k:'ball',c:'#3b3f85',r:4.5,many:1},'杨梅':{t:'#b3344f',k:'ball',c:'#9b1e3a',r:7,bump:1}};
const MILK={'不加奶':null,'牛奶':'#f8f3ea','厚乳':'#f3e3c3','燕麦奶':'#ecdcc0','淡奶':'#f0e4cc'};
const TOPS={'珍珠':'#2a1a12','芋圆':'#b79ad6','西米':'#e9e6df','脆波波':'#efe9de','爆爆珠':'#f07d6a','椰果':'#dcebe6','仙草冻':'#2f2a22','布丁':'#f5cd5a','红豆':'#7a2331','芋泥':'#a98bd0','麻薯':'#f3eee6','燕麦':'#d9bf8c','奥利奥碎':'#2b2522','黑糖':'#5b2c16','草莓粒':'#d93650'};
const CAPS={'不要':null,'奶盖':'#fbf7ee','芝士奶盖':'#fde6a4','奶油顶':'#fffdf8','雪顶':'#fff6e6'};
const GARN={'可可粉':'#6b4028','抹茶粉':'#7da35a','桂花蜜':'#e8a33a','薄荷叶':'#6fae6a'};
const ICES={'热':0,'去冰':0,'少冰':2,'正常冰':4};
const SUGARS=['无糖','三分糖','五分糖','七分糖','全糖'];
const CUPS={
 '直身杯':{d:'M40 40 L160 40 L146 240 L54 240 Z',T:42,B:238,rim:[40,160],straw:1,x:y=>{const t=(y-40)/200;return[43+14*t,157-14*t]}},
 '胖胖杯':{d:'M32 92 L168 92 L163 206 Q160 240 128 240 L72 240 Q40 240 37 206 Z',T:94,B:238,rim:[32,168],straw:1,x:y=>{if(y<206){const t=(y-92)/114;return[36+5*t,164-5*t]}const t=(y-206)/34;return[41+30*t*t,159-30*t*t]}},
 '牛奶瓶':{d:'M80 28 L120 28 L120 58 Q150 72 150 108 L150 226 Q150 240 136 240 L64 240 Q50 240 50 226 L50 108 Q50 72 80 58 Z',T:30,B:238,rim:[80,120],straw:1,sa:2,sx:-4,x:y=>{if(y<58)return[83,117];if(y<108){const t=(y-58)/50;return[83-28*t,117+28*t]}return[53,147]}},
 '马克杯':{d:'M44 78 L152 78 L152 220 Q152 240 132 240 L64 240 Q44 240 44 220 Z',T:80,B:238,rim:[44,152],straw:0,x:()=>[48,148],extra:'<path class="ln" d="M152 100 C194 100 194 194 152 194"/><path class="ln" d="M152 116 C176 116 176 178 152 178"/>'},
 '高脚杯':{d:'M42 40 L158 40 Q158 148 100 158 Q42 148 42 40 Z',T:42,B:156,rim:[42,158],straw:0,x:y=>{const t=Math.min(1,Math.max(0,(y-40)/118));const hw=58*Math.sqrt(Math.max(0,1-t*t*t));return[100-hw+5,100+hw-5]},extra:'<path class="ln" d="M97 158 L97 229 M103 158 L103 229"/><ellipse class="ln" cx="100" cy="233" rx="38" ry="5"/>'},
 '方杯':{d:'M50 58 L150 58 L150 240 L50 240 Z',T:60,B:220,rim:[50,150],straw:1,x:()=>[54,146],extra:'<rect x="51" y="222" width="98" height="17" class="gl"/><path class="ln" d="M50 222 L150 222"/>'}};

const DEF={cup:'直身杯',tea:'阿萨姆',fruits:{},milk:'牛奶',tops:{'珍珠':1},cap:'不要',garn:[],ice:'少冰',sugar:'五分糖'};
const clone=o=>JSON.parse(JSON.stringify(o));
function norm(o){const s=Object.assign(clone(DEF),o||{});if(!CUPS[s.cup])s.cup='直身杯';if(!TEAS[s.tea])s.tea='阿萨姆';if(!(s.milk in MILK))s.milk='牛奶';if(!(s.cap in CAPS))s.cap='不要';if(!(s.ice in ICES))s.ice='少冰';if(!SUGARS.includes(s.sugar))s.sugar='五分糖';
 s.fruits=Object.fromEntries(Object.entries(s.fruits||{}).filter(([k,n])=>FR[k]&&n>0).map(([k,n])=>[k,Math.min(3,n)]));
 s.tops=Object.fromEntries(Object.entries(s.tops||{}).filter(([k,n])=>k in TOPS&&n>0).map(([k,n])=>[k,Math.min(3,n)]));
 s.garn=(s.garn||[]).filter(g=>GARN[g]);return s}

/* ---------- recipes ---------- */
const TS=(s,...a)=>a.includes(s.tea),black=s=>TEAS[s.tea].g==='红茶',F=(s,f,n=1)=>(s.fruits[f]||0)>=n,P=(s,t,n=1)=>(s.tops[t]||0)>=n,M=s=>s.milk!=='不加奶',NM=s=>!M(s),G=(s,x)=>s.garn.includes(x);
const nF=s=>Object.values(s.fruits).filter(x=>x>0).length,nP=s=>Object.values(s.tops).filter(x=>x>0).length;
const bare=s=>!nF(s)&&!nP(s)&&s.cap==='不要'&&!s.garn.length;
const night=()=>{const h=new Date().getHours();return h>=22||h<5};
const moonBase=s=>TS(s,'茉莉绿茶')&&NM(s)&&bare(s)&&s.ice==='去冰'&&s.sugar==='无糖';

/* ---------- names ---------- */
const SHORT={'英德红茶':'英红','伯爵红茶':'伯爵','泰式红茶':'泰式','茉莉绿茶':'茉莉','冻顶乌龙':'冻顶','老白茶':'白茶','洛神花':'洛神'};
function autoName(s){
 const fs=Object.entries(s.fruits).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
 const ts=Object.entries(s.tops).filter(e=>e[1]>0&&!(e[0]==='草莓粒'&&s.fruits['草莓']));
 const fp=fs.length>=4?'缤纷':fs.slice(0,2).map(([f,n])=>(n>=3?'满杯':'')+f).join('');
 const tp=ts.length>=4?'全料':ts.slice(0,2).map(e=>e[0]).join('')+(ts.length>2?'多料':'');
 const cp={'奶盖':'奶盖','芝士奶盖':'芝士','奶油顶':'云顶','雪顶':'雪顶'}[s.cap]||'';
 const T=TEAS[s.tea],m=M(s);let base;
 if(!T.c)base=m?({'牛奶':'鲜奶'}[s.milk]||s.milk):(fs.length?'果饮':'白开水');
 else{const sh=SHORT[s.tea]||s.tea;if(m)base=s.tea==='抹茶'?'抹茶拿铁':(T.g==='绿茶 · 白茶'?sh+'奶绿':sh+'奶茶');else base=fs.length?sh+'果茶':s.tea}
 return (s.ice==='热'?'热':'')+fp+tp+cp+base}

function lookC(s){const cc=COF[s.cof],m=CMILK[s.milk];let col;
 if(!cc)col=m||'#e3eef1';else if(m)col=mix(cc,m,s.cof==='双份浓缩'?.5:.62);else col=(s.cof==='浓缩'||s.cof==='双份浓缩')?(s.ice==='热'?'#3f2416':'#57331d'):cc;
 s.syr.forEach(x=>{col=mix(col,SYR[x],.08)});
 const layers=s.mix==='分层'&&cc&&m?[[m,.6],[mix(cc,m,.12),.4]]:null;
 const tops={};['珍珠','燕麦','奥利奥碎'].forEach(k=>{if(s.add[k])tops[k]=s.add[k]});
 return{cup:s.cup,col,layers,tops,fruits:s.add['椰子肉']?{'椰子':s.add['椰子肉']}:{},cap:s.cap,garn:s.garn,ice:s.ice,name:nameC(s)}}
function nameC(s){const cc=COF[s.cof],m=CM(s);
 const ad=Object.entries(s.add).filter(e=>e[1]>0).map(([k,n])=>k==='椰子肉'&&n>=3?'满杯椰肉':k).slice(0,2).join('');
 const sy=s.syr.length>=3?'多糖浆':s.syr.slice(0,1).join('');
 const cp={'奶泡':'奶泡','奶油顶':'云顶','雪顶':'雪顶'}[s.cap]||'';
 let base;if(!cc)base=m?s.milk:'白开水';
 else if(m)base=(s.mix==='分层'?'脏脏':'')+({'椰乳':'生椰拿铁','冰博克':'冰博克拿铁','燕麦奶':'燕麦拿铁','厚乳':'厚乳拿铁'}[s.milk]||'拿铁');
 else base={'冷萃':'冷萃','手冲':'手冲咖啡'}[s.cof]||'美式';
 return (s.ice==='热'?'热':'冰')+ad+sy+cp+(s.cof==='双份浓缩'?'双份':'')+base}

function hex(h){return[1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}

function fromOld(o){const fm={'草莓':'草莓','芒果':'芒果','桃桃':'蜜桃','葡萄':'葡萄'};let tea=o.tea,fruits={};

 const tops={};(o.tops||[]).forEach(t=>{if(t in TOPS)tops[t]=1});
 return norm({cup:'直身杯',tea,fruits,milk:o.milk,tops,cap:o.cap,garn:[],ice:o.ice,sugar:o.sugar})}

try{const v2=JSON.parse(localStorage.getItem(KEY2)||'null');if(v2&&v2.items)store=v2;else migrate(JSON.parse(localStorage.getItem(KEY1)||'{}'))}catch(e){}

    q.firstChild.onclick=()=>{const s=ST[bk];s[sec.k][v]=Math.min(3,(s[sec.k][v]||0)+1);sync()};
    q.lastChild.onclick=()=>{const s=ST[bk],c=s[sec.k][v]||0;if(c<=1)delete s[sec.k][v];else s[sec.k][v]=c-1;sync()};wrap.appendChild(q)}
   else{const b=document.createElement('button');b.className='chip';b.id=`o-${bk}-${sec.k}-${i}`;b.dataset.k=sec.k;b.dataset.v=v;b.dataset.t=sec.t;
    b.innerHTML=(sec.k==='cup'?cupIcon(v):dot(v))+v;
    b.onclick=()=>{const s=ST[bk];if(sec.t==='multi'){const a=s[sec.k],j=a.indexOf(v);j<0?a.push(v):a.splice(j,1)}else s[sec.k]=v;sync()};wrap.appendChild(b)}};
  if(sec.g){let i=0;sec.g.forEach(([gn,vs])=>{const h=document.createElement('div');h.className='gh';h.textContent=gn;body.appendChild(h);const w=document.createElement('div');w.className='chips';vs.forEach(v=>add(w,v,i++));body.appendChild(w)})}

function summ(sec,s){const v=s[sec.k];if(sec.t==='qty'){const e=Object.entries(v).filter(x=>x[1]>0);return e.length?e.map(([k,n])=>n>1?k+'×'+n:k).join('  '):'不加'}if(sec.t==='multi')return v.length?v.join('  '):'不加';return v}
function sync(){
 const s=ST[cur],Pn=document.getElementById('panel-'+cur),closed=cur==='bar'&&!barOpen();
 ['tea','coffee','bar'].forEach(b=>document.getElementById('panel-'+b).hidden=b!==cur||closed);

 Pn.querySelectorAll('.q').forEach(q=>{const n=s[q.dataset.k][q.dataset.v]||0;q.classList.toggle('on',n>0);q.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('f',i<n));q.lastChild.hidden=n===0});
 BARS[cur].secs.forEach(sec=>document.getElementById(`sv-${cur}-${sec.k}`).textContent=summ(sec,s));
 const d=BARS[cur].look(s);

const cntOf=bk=>BARS[bk].R.filter(r=>store.items[r.id]).length;

let view='make',dctx=null;
function show(v){view=v;['make','drink','book'].forEach(n=>document.getElementById('v-'+n).hidden=n!==v);
 document.getElementById('tabs').hidden=v==='drink';

function openDrink(bk,st,note,from){dctx={bk,st,note,from,lv:100};
 const d=new Date(),p=n=>String(n).padStart(2,'0');
 document.getElementById('d-no').textContent=from==='book'?'图鉴 · '+BARS[bk].label:pad4(store.made);
 document.getElementById('d-time').textContent=`${p(d.getMonth()+1)}.${p(d.getDate())}  ${p(d.getHours())}:${p(d.getMinutes())}`;
 document.getElementById('d-name').textContent=note.n;
 document.getElementById('d-note').innerHTML=`<div class="k">${note.k}</div><div class="d">${note.d}</div>${note.c?`<div class="c">${note.c}</div>`:''}${note.w?`<div class="w">${note.w}</div>`:''}`;
 document.getElementById('d-alt').textContent=from==='book'?'照这杯做':'回到制作台';
 document.getElementById('d-back').hidden=from!=='book';
 resetRcpt();drawDrink();show('drink')}
function drawDrink(){const{bk,st,lv}=dctx;
 document.getElementById('d-cup').innerHTML=cupSVG(BARS[bk].look(st),lv,320);
 document.getElementById('d-meta').textContent=lv<=0?'喝光啦，一滴都没剩':BARS[bk].meta(st).join(' · ')+(lv<100?` · 还剩 ${lv}%`:'');
 document.getElementById('d-sip').textContent=lv<=0?(dctx.from==='book'?'再倒一杯':'再做一杯'):'喝一口'}
function serve(){
 if(cur==='bar'&&!barOpen())return;
 const s=ST[cur],R=BARS[cur].R;store.made=(store.made||0)+1;
 const hits=R.filter(r=>r.ok(s)),fresh=hits.find(r=>!store.items[r.id]);let note;
 if(fresh){store.items[fresh.id]=clone(s);note={k:fresh.hidden?'隐藏款解锁':'新配方解锁',n:fresh.name,d:fresh.desc,c:`收进${BARS[cur].label}图鉴 · ${cntOf(cur)} / ${R.length}`}}
 else if(hits.length)note={k:'图鉴里已经有了',n:hits[0].name,d:'这杯已经收过啦，换个搭配，试试还没解锁的那些。'};
 else note={k:'原创配方',n:BARS[cur].look(s).name,d:'这杯还不在图鉴里，是你自己的独家配方。'};
 if(cur==='tea'&&!night()&&moonBase(s)&&!store.items.moon)note.w='好像有一杯，只在深夜才会出现……';
 save();header();openDrink(cur,clone(s),note,'make')}
const pk=a=>a[Math.floor(Math.random()*a.length)],rq=(keys,p1,p2)=>{const o={};if(Math.random()<p1)o[pk(keys)]=1+Math.floor(Math.random()*2);if(Math.random()<p2)o[pk(keys)]=1;return o};
function rand(){
 if(cur==='tea')ST.tea={cup:pk(TEA_CUPS),tea:pk(Object.keys(TEAS)),fruits:rq(Object.keys(FR),.55,.2),milk:pk(Object.keys(MILK)),tops:rq(Object.keys(TOPS),.6,.25),cap:Math.random()<.6?'不要':pk(Object.keys(CAPS)),garn:Math.random()<.2?[pk(Object.keys(GARN))]:[],ice:pk(Object.keys(ICES)),sugar:pk(SUGARS)};
 else if(cur==='coffee')ST.coffee={cup:pk(BARS.coffee.cups),cof:pk(Object.keys(COF).slice(0,4)),milk:pk(Object.keys(CMILK)),mix:Math.random()<.25?'分层':'搅匀',syr:Math.random()<.4?[pk(Object.keys(SYR))]:[],add:rq(Object.keys(CADD),.3,0),cap:Math.random()<.6?'不要':pk(Object.keys(CCAP)),garn:Math.random()<.25?[pk(Object.keys(CGARN))]:[],ice:pk(Object.keys(ICES)),sugar:pk(SUGARS)};
 else{const sp=[pk(Object.keys(SPIRITS))];if(Math.random()<.15)sp.push(pk(Object.keys(SPIRITS)));ST.bar={cup:pk(BARS.bar.cups),sp:[...new Set(sp)],mx:rq(Object.keys(MIXERS),.85,.4),fl:Math.random()<.45?pk(Object.keys(FLAV).slice(1)):'不加',cap:Math.random()<.8?'不要':'蛋白泡沫',gar:Math.random()<.5?[pk(Object.keys(BGAR))]:[],ice:pk(Object.keys(BICE))}}
 sync()}
function renderBook(){
 const tot=ALL_R.filter(r=>store.items[r.id]).length;
 document.getElementById('b-count').textContent=`${tot} / ${ALL_R.length}`;
 document.getElementById('b-bar').style.width=(tot/ALL_R.length*100)+'%';
 document.querySelectorAll('#seg-book button').forEach(b=>{const bk=b.dataset.b;b.setAttribute('aria-pressed',bk===bookBar);b.querySelector('small').textContent=bk==='fav'?String((store.favs||[]).length):`${cntOf(bk)}/${BARS[bk].R.length}`});
 const g=document.getElementById('b-grid');g.innerHTML='';
 if(bookBar==='fav'){renderFavs(g);return}
 document.getElementById('b-empty').hidden=true;g.hidden=false;const R=BARS[bookBar].R;
 [...R.filter(r=>!r.hidden),...R.filter(r=>r.hidden)].forEach(r=>{const st=store.items[r.id],el=document.createElement(st?'button':'div');el.className='card';
  if(st){const ns=BARS[bookBar].norm(st);el.innerHTML=`<div class="cc">${cupSVG(BARS[bookBar].look(ns),100,100)}</div><div class="cn">${r.name}</div><div class="cd">${r.desc}</div>${r.hidden?'<span class="tag">隐藏款</span>':''}`;
   const bk=bookBar;el.onclick=()=>openDrink(bk,ns,{k:r.hidden?'隐藏款':'图鉴',n:r.name,d:r.desc},'book')}
  else el.innerHTML=`<div class="cc">${lockedSVG(100,bookBar)}</div><div class="cn dim">${r.hidden?'隐藏款':'未解锁'}</div><div class="cd">${r.hidden?'没有提示，全靠缘分':'提示：'+r.hint}</div>`;
  g.appendChild(el)})}

document.getElementById('b-serve').onclick=serve;
document.getElementById('b-rand').onclick=rand;
document.getElementById('b-clear').onclick=clearCup;
document.getElementById('t-make').onclick=()=>show('make');
document.getElementById('t-book').onclick=()=>show('book');
document.querySelectorAll('#seg-make button').forEach(b=>b.onclick=()=>{cur=b.dataset.b;sync()});

matchMedia('(min-width:780px)').addEventListener('change',()=>{if(view==='make')sync()});
/* ---------- clear, receipt, favourites, share ---------- */
function clearCup(){const s=ST[cur];
 if(cur==='tea')Object.assign(s,{tea:'不要茶',fruits:{},milk:'不加奶',tops:{},cap:'不要',garn:[]});
 else if(cur==='coffee')Object.assign(s,{cof:'不要咖啡',milk:'不加奶',mix:'搅匀',syr:[],add:{},cap:'不要',garn:[]});
 else Object.assign(s,{sp:[],mx:{},fl:'不加',cap:'不要',gar:[]});sync()}
store.favs=store.favs||[];
const favKey=(bk,s)=>bk+'|'+JSON.stringify(s);
const favIdx=()=>dctx?(store.favs||[]).findIndex(f=>favKey(f.bk,f.s)===favKey(dctx.bk,dctx.st)):-1;
const rows=(bk,s)=>BARS[bk].secs.map(sec=>[sec.l.replace(' · 可以多选',''),summ(sec,s)]);
function barcode(seed){const g=rng(hash(seed));let x=0,o='';for(let i=0;i<46;i++){const w=1+Math.floor(g()*3);if(i%2===0)o+=`<rect x="${x}" y="0" width="${w}" height="40"/>`;x+=w}return{svg:`<svg viewBox="0 0 ${x} 40" aria-hidden="true" style="fill:var(--ink)">${o}</svg>`,w:x,bars:o}}
function resetRcpt(){document.getElementById('rcpt').hidden=true;document.getElementById('d-ticket').setAttribute('aria-expanded','false');document.getElementById('d-tk').textContent='小票 ›';
 document.getElementById('r-fbox').hidden=true;document.getElementById('r-img').hidden=true;shareFile=null;
 const{bk,st}=dctx;document.getElementById('r-rows').innerHTML=rows(bk,st).map(([a,b])=>`<div class="rrow"><span>${a}</span><span>${b}</span></div>`).join('');
 document.getElementById('r-bc').innerHTML=barcode(dctx.note.n+document.getElementById('d-no').textContent).svg;favUI()}
function favUI(){const on=favIdx()>=0,b=document.getElementById('r-fav');b.classList.toggle('on',on);document.getElementById('r-favt').textContent=on?'已收藏':'收藏'}
document.getElementById('d-ticket').onclick=()=>{const r=document.getElementById('rcpt'),open=r.hidden;r.hidden=!open;document.getElementById('d-ticket').setAttribute('aria-expanded',open);document.getElementById('d-tk').textContent=open?'收起 ‹':'小票 ›'};
document.getElementById('r-fav').onclick=()=>{const i=favIdx();if(i>=0){store.favs.splice(i,1);save();favUI();document.getElementById('r-fbox').hidden=true;return}
 const fb=document.getElementById('r-fbox');fb.hidden=!fb.hidden;const inp=document.getElementById('r-name');inp.value=dctx.note.n;if(!fb.hidden)inp.focus()};
document.getElementById('r-save').onclick=()=>{const name=(document.getElementById('r-name').value||'').trim()||dctx.note.n;
 store.favs.unshift({bk:dctx.bk,s:clone(dctx.st),name,t:Date.now()});if(store.favs.length>80)store.favs.length=80;save();document.getElementById('r-fbox').hidden=true;favUI()};
document.getElementById('r-name').onkeydown=e=>{if(e.key==='Enter')document.getElementById('r-save').click()};
function renderFavs(g){const fv=store.favs||[],em=document.getElementById('b-empty');em.hidden=fv.length>0;g.hidden=!fv.length;
 fv.forEach(f=>{const bk=f.bk,ns=BARS[bk].norm(f.s),el=document.createElement('button');el.className='card';
  el.innerHTML=`<div class="cc">${cupSVG(BARS[bk].look(ns),100,100)}</div><div class="cn"></div><div class="cd">${BARS[bk].label} · ${BARS[bk].meta(ns).join(' · ')}</div>`;el.querySelector('.cn').textContent=f.name;
  el.onclick=()=>openDrink(bk,ns,{k:'我的配方 · '+BARS[bk].label,n:f.name,d:'收藏在「我的配方」里，想喝随时来。'},'book');g.appendChild(el)})}
function svgExport(svg){return svg.replace(/class="ln" style="stroke:var\(--ink3\)"/g,'fill="none" stroke="#aaa9a4" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"')
 .replace(/class="ln"/g,'fill="none" stroke="#262625" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"').replace(/style="fill:var\(--paper\)" class="lf"/g,'fill="#ffffff" stroke="#262625" stroke-width="1.2"')
 .replace(/class="lf"/g,'stroke="#262625" stroke-width="1.2"').replace(/class="gl"/g,'fill="rgba(255,255,255,.7)"').replace(/class="stw"/g,'fill="#ffffff" stroke="#262625" stroke-width="1.4"')
 .replace(/style="stroke:var\(--ink3\)"/g,'stroke="#aaa9a4"').replace(/ style="height:[^"]*"/,' width="440" height="600"').replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ')}
let shareFile=null;
async function receiptImage(){const{bk,st,note}=dctx,d=BARS[bk].look(st),rs=rows(bk,st),no=document.getElementById('d-no').textContent,tm=document.getElementById('d-time').textContent;
 const F='"SGH","PingFang SC","Hiragino Sans GB",sans-serif';try{await document.fonts.load('30px SGH')}catch(e){}
 const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgExport(cupSVG(d,100,380)));try{await img.decode()}catch(e){}
 const W=720,pad=64,H=1120+rs.length*48,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 g.fillStyle='#efede8';g.fillRect(0,0,W,H);g.fillStyle='#fffefb';g.fillRect(28,20,W-56,H-40);
 g.fillStyle='#efede8';for(let x=28;x<W-28;x+=16){g.beginPath();g.moveTo(x,20);g.lineTo(x+8,28);g.lineTo(x+16,20);g.fill();g.beginPath();g.moveTo(x,H-20);g.lineTo(x+8,H-28);g.lineTo(x+16,H-20);g.fill()}
 const txt=(s,x,y,size,col,al,ls)=>{g.font=`${size}px ${F}`;g.fillStyle=col;g.textAlign=al||'center';if('letterSpacing' in g)g.letterSpacing=(ls||0)+'px';g.fillText(s,x,y)};
 const dash=y=>{g.save();g.strokeStyle='#d8d5ce';g.setLineDash([7,7]);g.lineWidth=1.5;g.beginPath();g.moveTo(pad,y);g.lineTo(W-pad,y);g.stroke();g.restore()};
 let y=100;txt('小肉松奶茶铺',W/2,y,40,'#262625','center',8);y+=40;txt('SINCE 2026.09.28',W/2,y,16,'#aaa9a4','center',6);y+=34;dash(y);y+=44;
 txt(no,pad,y,20,'#6e6d69','left',3);txt(tm,W-pad,y,20,'#6e6d69','right',3);y+=22;
 if(img.width){const ih=380,iw=ih*220/300;g.drawImage(img,(W-iw)/2,y,iw,ih)}y+=380+58;
 txt(note.n,W/2,y,38,'#262625','center',4);y+=36;txt(BARS[bk].label+' · '+BARS[bk].meta(st).join(' · '),W/2,y,18,'#aaa9a4','center',3);y+=36;dash(y);y+=46;
 rs.forEach(([a,b])=>{txt(a,pad,y,22,'#9a9892','left',4);g.font=`22px ${F}`;let v=b;while(g.measureText(v).width>W-2*pad-120&&v.length>2)v=v.slice(0,-2)+'…';txt(v,W-pad,y,22,'#262625','right',1);y+=48});
 y-=14;dash(y);y+=46;txt('合计',pad,y,24,'#262625','left',4);txt('1 杯',W-pad,y,24,'#262625','right',2);y+=40;
 const bc=barcode(note.n+no),bw=360,sc=bw/bc.w,g2=rng(hash(note.n+no));let x=(W-bw)/2;g.fillStyle='#262625';for(let i=0;i<46;i++){const w=1+Math.floor(g2()*3);if(i%2===0)g.fillRect(x,y,w*sc,64);x+=w*sc}
 y+=64+34;txt('谢谢光临 · 下次再来',W/2,y,18,'#aaa9a4','center',6);
 return c}
document.getElementById('r-share').onclick=async()=>{const box=document.getElementById('r-img'),pic=document.getElementById('r-pic'),sys=document.getElementById('r-sys');
 const b=document.getElementById('r-share');b.disabled=true;b.textContent='生成中…';
