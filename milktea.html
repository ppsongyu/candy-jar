const DEF={cup:'直身杯',tea:'阿萨姆',fruits:{},veg:{},milk:'牛奶',tops:{'珍珠':1},cap:'不要',garn:[],ice:'少冰',sw:'普通糖',sugar:'五分糖'};
const clone=o=>JSON.parse(JSON.stringify(o));
function norm(o){const s=Object.assign(clone(DEF),o||{});if(!CUPS[s.cup])s.cup='直身杯';if(!TEAS[s.tea])s.tea='阿萨姆';if(!(s.milk in MILK))s.milk='牛奶';if(!(s.cap in CAPS))s.cap='不要';if(!(s.ice in ICES))s.ice='少冰';if(!SUGARS.includes(s.sugar))s.sugar='五分糖';
 s.fruits=Object.fromEntries(Object.entries(s.fruits||{}).filter(([k,n])=>FR[k]&&!FR[k].veg&&n>0).map(([k,n])=>[k,Math.min(3,n)]));
 s.veg=Object.fromEntries(Object.entries(s.veg||{}).filter(([k,n])=>FR[k]&&FR[k].veg&&n>0).map(([k,n])=>[k,Math.min(3,n)]));if(!SWS.includes(s.sw))s.sw='普通糖';
 s.tops=Object.fromEntries(Object.entries(s.tops||{}).filter(([k,n])=>k in TOPS&&n>0).map(([k,n])=>[k,Math.min(3,n)]));
 s.garn=(s.garn||[]).filter(g=>GARN[g]);return s}

const nF=s=>Object.values(s.fruits).filter(x=>x>0).length,nP=s=>Object.values(s.tops).filter(x=>x>0).length;
const V=(s,v,n=1)=>((s.veg||{})[v]||0)>=n,nV=s=>Object.values(s.veg||{}).filter(x=>x>0).length;
const bare=s=>!nF(s)&&!nP(s)&&!nV(s)&&s.cap==='不要'&&!s.garn.length;

function autoName(s){
 const fs=Object.entries({...s.fruits,...(s.veg||{})}).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
 const ts=Object.entries(s.tops).filter(e=>e[1]>0&&!(e[0]==='草莓粒'&&s.fruits['草莓']));
 const fp=fs.length>=4?'缤纷':fs.slice(0,2).map(([f,n])=>(n>=3?'满杯':'')+f).join('');
 const tp=ts.length>=4?'全料':ts.slice(0,2).map(e=>e[0]).join('')+(ts.length>2?'多料':'');
 const cp={'奶盖':'奶盖','芝士奶盖':'芝士','奶油顶':'云顶','雪顶':'雪顶'}[s.cap]||'';
 const T=TEAS[s.tea],m=M(s);let base;
 if(!T.c)base=m?({'牛奶':'鲜奶'}[s.milk]||s.milk):(fs.length?'果饮':'白开水');
 else{const sh=SHORT[s.tea]||s.tea;if(m)base=s.tea==='抹茶'?'抹茶拿铁':(T.g==='绿茶 · 白茶'?sh+'奶绿':sh+'奶茶');else base=fs.length?sh+'果茶':s.tea}
 return (s.ice==='热'?'热':'')+fp+tp+cp+base}

function mix(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function hash(str){let h=7;for(const ch of str)h=(h*31+ch.charCodeAt(0))>>>0;return h||1}
function rng(seed){let x=seed>>>0||1;return()=>{x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296}}

 if(fs.length&&!T.c&&!m)c=FR[fs[0][0]].t;
 fs.forEach(([f,n])=>{c=mix(c,FR[f].t,Math.min(.72,(m?.14:(T.c?.3:.35))*n))});
 Object.entries(s.veg||{}).forEach(([v,n])=>{if(n>0)c=mix(c,FR[v].t,Math.min(.8,(v==='羽衣甘蓝'?.35:.12)*n))});

function clearCup(){const s=ST[cur];
 if(cur==='tea')Object.assign(s,{tea:'不要茶',fruits:{},milk:'不加奶',tops:{},cap:'不要',garn:[]});
 else if(cur==='coffee')Object.assign(s,{cof:'不要咖啡',milk:'不加奶',mix:'搅匀',syr:[],add:{},cap:'不要',garn:[]});
 else Object.assign(s,{sp:[],mx:{},fl:'不加',cap:'不要',gar:[]});sync()}
store.favs=store.favs||[];

function svgExport(svg){return svg.replace(/class="ln" style="stroke:var\(--ink3\)"/g,'fill="none" stroke="#aaa9a4" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"')
 .replace(/class="ln"/g,'fill="none" stroke="#262625" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"').replace(/style="fill:var\(--paper\)" class="lf"/g,'fill="#ffffff" stroke="#262625" stroke-width="1.2"')
 .replace(/class="lf"/g,'stroke="#262625" stroke-width="1.2"').replace(/class="gl"/g,'fill="rgba(255,255,255,.7)"').replace(/class="stw"/g,'fill="#ffffff" stroke="#262625" stroke-width="1.4"')
 .replace(/style="stroke:var\(--ink3\)"/g,'stroke="#aaa9a4"').replace(/ style="height:[^"]*"/,' width="440" height="600"').replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ')}

async function receiptImage(){const{bk,st,note}=dctx,d={...BARS[bk].look(st),stir:dctx.stir},rs=rows(bk,st),no=document.getElementById('d-no').textContent,tm=document.getElementById('d-time').textContent;

 const W=720,pad=64,H=1120+rs.length*48,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 g.fillStyle='#efede8';g.fillRect(0,0,W,H);g.fillStyle='#fffefb';g.fillRect(28,20,W-56,H-40);
 g.fillStyle='#efede8';for(let x=28;x<W-28;x+=16){g.beginPath();g.moveTo(x,20);g.lineTo(x+8,28);g.lineTo(x+16,20);g.fill();g.beginPath();g.moveTo(x,H-20);g.lineTo(x+8,H-28);g.lineTo(x+16,H-20);g.fill()}
 const txt=(s,x,y,size,col,al,ls)=>{g.font=`${size}px ${F}`;g.fillStyle=col;g.textAlign=al||'center';if('letterSpacing' in g)g.letterSpacing=(ls||0)+'px';g.fillText(s,x,y)};
 const dash=y=>{g.save();g.strokeStyle='#d8d5ce';g.setLineDash([7,7]);g.lineWidth=1.5;g.beginPath();g.moveTo(pad,y);g.lineTo(W-pad,y);g.stroke();g.restore()};
 let y=100;txt('小肉松奶茶铺',W/2,y,40,'#262625','center',8);y+=40;txt('SINCE 2026.09.28',W/2,y,16,'#aaa9a4','center',6);y+=34;dash(y);y+=44;
 txt(no,pad,y,20,'#6e6d69','left',3);txt(tm,W-pad,y,20,'#6e6d69','right',3);y+=22;
 if(img.width){const ih=380,iw=ih*220/300;g.drawImage(img,(W-iw)/2,y,iw,ih)}y+=380+58;
 txt(note.n,W/2,y,38,'#262625','center',4);y+=36;txt(BARS[bk].label+' · '+BARS[bk].meta(st).join(' · '),W/2,y,18,'#aaa9a4','center',3);y+=36;dash(y);y+=46;
 rs.forEach(([a,b])=>{txt(a,pad,y,22,'#9a9892','left',4);g.font=`22px ${F}`;let v=b;while(g.measureText(v).width>W-2*pad-120&&v.length>2)v=v.slice(0,-2)+'…';txt(v,W-pad,y,22,'#262625','right',1);y+=48});
 y-=14;dash(y);y+=46;txt('合计',pad,y,24,'#262625','left',4);txt('1 杯',W-pad,y,24,'#262625','right',2);y+=40;
 const bc=barcode(note.n+no),bw=360,sc=bw/bc.w,g2=rng(hash(note.n+no));let x=(W-bw)/2;g.fillStyle='#262625';for(let i=0;i<46;i++){const w=1+Math.floor(g2()*3);if(i%2===0)g.fillRect(x,y,w*sc,64);x+=w*sc}
 y+=64+34;txt('谢谢光临 · 下次再来',W/2,y,18,'#aaa9a4','center',6);
 return c}

/* ---------- stirring ---------- */
function attachStir(el,api){let last=null,cx=0,cy=0,raf=0;const ang=e=>Math.atan2(e.clientY-cy,e.clientX-cx);
 el.addEventListener('pointerdown',e=>{if(!api.can())return;const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height*.62;last=ang(e);try{el.setPointerCapture(e.pointerId)}catch(_){}});
 el.addEventListener('pointermove',e=>{if(last===null)return;const a=ang(e);let d=a-last;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;last=a;const v=api.get();if(v>=5)return;api.set(Math.min(5,v+Math.abs(d)/(2*Math.PI)));if(!raf)raf=requestAnimationFrame(()=>{raf=0;api.draw()})});
 const up=()=>{last=null};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
attachStir(document.getElementById('d-cup'),{can:()=>!!(dctx&&dctx.canStir&&dctx.lv>0),get:()=>dctx.stir,set:v=>{dctx.stir=v},draw:drawDrink});

document.getElementById('d-stirbtn').onclick=()=>{if(!dctx||dctx.stir>=5)return;const from=dctx.stir,to=Math.min(5,Math.floor(from+1e-6)+1),t0=performance.now(),dur=matchMedia('(prefers-reduced-motion: reduce)').matches?1:450;
  const step=now=>{const k=Math.min(1,(now-t0)/dur);dctx.stir=from+(to-from)*k;drawDrink();if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)};
